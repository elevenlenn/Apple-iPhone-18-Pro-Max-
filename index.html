<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#141416" />
    <meta name="description" content="iPhone 18 Pro Max — Apple concept design showcase." />
    <title>iPhone 18 Pro Max — Apple</title>
    <!-- Preconnect & font-display swap untuk pemuatan font tanpa memblokir teks -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      /* Loading Screen Statis CSS Murni — Langsung tampil instan tanpa JS */
      #app-static-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background-color: #141416;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        user-select: none;
        transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.5s ease;
      }
      #app-static-loader.fade-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .apple-static-logo {
        width: 48px;
        height: 48px;
        fill: #ffffff;
        margin-bottom: 24px;
        animation: staticPulse 1.8s ease-in-out infinite;
      }
      .static-loader-title {
        color: #f5f5f7;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin-bottom: 24px;
      }
      .static-loader-bar-bg {
        width: 192px;
        height: 4px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 9999px;
        overflow: hidden;
      }
      .static-loader-bar-fill {
        width: 30%;
        height: 100%;
        background: #ffffff;
        border-radius: 9999px;
        animation: staticBarLoad 1.5s ease-in-out infinite alternate;
      }
      @keyframes staticPulse {
        0%, 100% { opacity: 0.6; transform: scale(0.98); }
        50% { opacity: 1; transform: scale(1); }
      }
      @keyframes staticBarLoad {
        0% { transform: translateX(-40%); width: 25%; }
        100% { transform: translateX(200%); width: 45%; }
      }
    </style>
  </head>
  <body class="bg-black text-white">
    <!-- Static pure CSS loading screen: langsung ada sejak HTML parsing pertama -->
    <div id="app-static-loader">
      <img
        src="/photo/logo/apple-logo-transparent.png"
        alt="Apple Logo"
        class="apple-static-logo"
        style="width: 48px; height: 56px; object-fit: contain; margin-bottom: 20px;"
      />
      <div class="static-loader-title">iPhone 18 Pro Max</div>
      <div class="static-loader-bar-bg">
        <div class="static-loader-bar-fill"></div>
      </div>
    </div>

    <div id="root"></div>
    <noscript>Website ini membutuhkan JavaScript.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
